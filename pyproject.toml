[project]
name = "fbm"
version = "0.1.0"
description = "AI front office for a Yahoo Fantasy Basketball 9-cat H2H league"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quinjan Robert R. Ocampo" }]
keywords = ["fantasy-basketball", "yahoo-fantasy", "nba", "mcp", "ai-agent", "h2h-categories"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
    "markdown>=3.11.1",
    "mcp>=1.10",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "playwright>=1.45",
    "plotly>=7.1.0",
    "rich>=13.7",
    "scipy>=1.18.1",
    "streamlit>=1.66.0",
    "typer>=0.12",
    "tzdata>=2024.1",
    "xmltodict>=0.13",
]

[project.urls]
Homepage = "https://github.com/quinjan/basketball-fantasy-manager"
Issues = "https://github.com/quinjan/basketball-fantasy-manager/issues"

[project.scripts]
fbm = "fbm.cli:app"
fbm-mcp = "fbm.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
