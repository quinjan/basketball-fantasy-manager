[project]
name = "fbm"
version = "0.1.0"
description = "AI front office for a Yahoo Fantasy Basketball 9-cat H2H league"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "rich>=13.7",
    "scipy>=1.18.1",
    "typer>=0.12",
    "tzdata>=2024.1",
    "xmltodict>=0.13",
]

[project.scripts]
fbm = "fbm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
